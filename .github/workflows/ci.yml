name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # The gate: type-check, lint, format, unit tests and e2e on recorded fixtures.
      - run: pnpm run check
        env:
          CI: true
          SKIP_LIVE: 1
      # The live API smoke test is informative only: TheSportsDB being down or the shared free
      # key being rate-limited shouldn't fail a correct change. A failure shows as a warning.
      - run: pnpm exec playwright test e2e/live.spec.ts --project=desktop
        continue-on-error: true
        env:
          CI: true
